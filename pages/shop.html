<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f0d0b"
    >

    <meta
        name="description"
        content="Explore the latest collection from SANA Boutique."
    >

    <title>Shop | SANA Boutique</title>


    <!-- =====================================
         GOOGLE FONTS
    ====================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="../css/shop.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <!-- =====================================
         SANA HEADER STYLE
         No separate header.css needed
    ====================================== -->

    <style>

        /* =====================================
           HEADER
        ===================================== */

        .app-header {

            position: sticky;

            top: 0;

            z-index: 900;

            width: 100%;

            height: 70px;

            display: grid;

            grid-template-columns: 1fr auto 1fr;

            align-items: center;

            padding: 0 18px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5, 5, 5, 0.98),
                    rgba(8, 8, 8, 0.94)
                );

            border-bottom:
                1px solid
                rgba(217, 169, 40, 0.18);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

        }


        /* =====================================
           HEADER BUTTONS
        ===================================== */

        .header-button {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.04);

            border:
                1px solid
                rgba(217, 169, 40, 0.22);

            color:
                var(--gold-light);

            font-size: 22px;

            line-height: 1;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        .header-button:active {

            transform: scale(0.90);

        }


        .header-button:hover {

            background:
                rgba(217, 169, 40, 0.10);

            box-shadow:
                0 0 18px
                rgba(217, 169, 40, 0.14);

        }


        /* =====================================
           LEFT BUTTON
        ===================================== */

        .app-header .header-button:first-child {

            justify-self: start;

        }


        /* =====================================
           RIGHT BUTTON
        ===================================== */

        .app-header .header-button:last-child {

            justify-self: end;

        }


        /* =====================================
           BRAND
        ===================================== */

        .app-header .brand {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            line-height: 1;

            text-align: center;

        }


        .app-header .brand-name {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 27px;

            font-weight: 600;

            letter-spacing: 5px;

            color:
                var(--cream);

            text-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.06);

        }


        .app-header .brand-subtitle {

            margin-top: 5px;

            font-family:
                "Inter",
                sans-serif;

            font-size: 8px;

            font-weight: 600;

            letter-spacing: 4px;

            color:
                var(--gold-light);

        }


        /* =====================================
           SHOP PAGE TOP SPACE
        ===================================== */

        .shop-page {

            width: 100%;

            min-height: 100vh;

        }


        /* =====================================
           MOBILE HEADER
        ===================================== */

        @media (max-width: 480px) {

            .app-header {

                height: 68px;

                padding:
                    0 14px;

            }


            .header-button {

                width: 40px;

                height: 40px;

                font-size: 21px;

            }


            .app-header .brand-name {

                font-size: 25px;

                letter-spacing: 4px;

            }


            .app-header .brand-subtitle {

                font-size: 7px;

                letter-spacing: 3px;

            }

        }


        /* =====================================
           LARGER SCREENS
        ===================================== */

        @media (min-width: 768px) {

            .app-header {

                max-width: 700px;

                margin: 0 auto;

            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================
         HEADER
    ===================================== -->

    <header class="app-header">


        <!-- BACK -->

        <button
            type="button"
            class="header-button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <!-- BRAND -->

        <div
            class="brand"
            aria-label="SANA Boutique Shop"
        >

            <div class="brand-name">
                SANA
            </div>

            <div class="brand-subtitle">
                SHOP
            </div>

        </div>


        <!-- SEARCH -->

        <button
            type="button"
            class="header-button"
            id="shopSearchButton"
            aria-label="Open product search"
        >
            ⌕
        </button>

    </header>



    <!-- =====================================
         SHOP PAGE
    ===================================== -->

    <main class="shop-page">


        <!-- =====================================
             SHOP INTRO
        ===================================== -->

        <section
            class="shop-intro"
            aria-labelledby="shopTitle"
        >

            <span class="shop-eyebrow">
                DISCOVER
            </span>


            <h1 id="shopTitle">
                Our Collection
            </h1>


            <p>
                Explore elegant pieces
                carefully selected for you.
            </p>

        </section>



        <!-- =====================================
             SEARCH
        ===================================== -->

        <section
            class="shop-search"
            id="shopSearch"
            aria-label="Product search"
        >

            <div class="search-box">

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    ⌕
                </span>


                <input
                    type="search"
                    id="productSearch"
                    name="productSearch"
                    placeholder="Search products..."
                    autocomplete="off"
                    aria-label="Search products"
                >


                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    aria-label="Clear search"
                >
                    ×
                </button>

            </div>

        </section>



        <!-- =====================================
             CATEGORIES
        ===================================== -->

        <section
            class="shop-categories"
            aria-label="Product categories"
        >

            <div
                class="category-scroll"
                id="categoryFilters"
            >

                <button
                    type="button"
                    class="category-filter active"
                    data-category="all"
                    aria-pressed="true"
                >
                    All
                </button>


                <button
                    type="button"
                    class="category-filter"
                    data-category="unstitched"
                    aria-pressed="false"
                >
                    Unstitched
                </button>


                <button
                    type="button"
                    class="category-filter"
                    data-category="kurtis"
                    aria-pressed="false"
                >
                    Kurtis
                </button>


                <button
                    type="button"
                    class="category-filter"
                    data-category="abayas"
                    aria-pressed="false"
                >
                    Abayas
                </button>


                <button
                    type="button"
                    class="category-filter"
                    data-category="shawls"
                    aria-pressed="false"
                >
                    Shawls
                </button>


                <button
                    type="button"
                    class="category-filter"
                    data-category="other"
                    aria-pressed="false"
                >
                    Other
                </button>

            </div>

        </section>



        <!-- =====================================
             RESULTS HEADER
        ===================================== -->

        <section class="results-header">

            <div>

                <span class="results-label">
                    COLLECTION
                </span>


                <h2 id="resultsTitle">
                    All Products
                </h2>

            </div>


            <button
                type="button"
                class="filter-button"
                id="filterButton"
                aria-label="Filter products"
            >
                ☷ Filter
            </button>

        </section>



        <!-- =====================================
             PRODUCTS
        ===================================== -->

        <section
            class="shop-products"
            aria-label="Products"
        >

            <div
                class="products-grid"
                id="shopProducts"
            >

                <div class="loading">

                    Loading collection...

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================
         BOTTOM NAVIGATION
    ===================================== -->

    <nav
        class="bottom-navigation"
        aria-label="Main navigation"
    >


        <!-- HOME -->

        <a
            href="../index.html"
            class="nav-item"
            aria-label="Home"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⌂
            </span>

            <span>
                Home
            </span>

        </a>



        <!-- SHOP -->

        <a
            href="shop.html"
            class="nav-item active"
            aria-current="page"
            aria-label="Shop"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ♧
            </span>

            <span>
                Shop
            </span>

        </a>



        <!-- CREATE PRODUCT -->

        <a
            href="post.html"
            class="post-button"
            id="postButton"
            aria-label="Create new product"
        >
            +
        </a>



        <!-- ABOUT -->

        <a
            href="about.html"
            class="nav-item"
            aria-label="About"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ♙
            </span>

            <span>
                About
            </span>

        </a>



        <!-- CONTACT -->

        <a
            href="contact.html"
            class="nav-item"
            aria-label="Contact"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⌕
            </span>

            <span>
                Contact
            </span>

        </a>


    </nav>


</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="../js/app.js"></script>

<script src="../js/navigation.js"></script>

<script src="../js/api.js"></script>

<script src="../js/shop.js"></script>


</body>

</html>
