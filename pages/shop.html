<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f0d0b"
    >

    <meta
        name="description"
        content="Explore the latest collection from SANA Boutique."
    >

    <title>Shop | SANA Boutique</title>


    <!-- =====================================
         GOOGLE FONTS
    ====================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         GLOBAL CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="../css/shop.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


<div id="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="app-header">


        <!-- BACK -->

        <button
            type="button"
            class="header-button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <!-- BRAND -->

        <div
            class="brand"
            aria-label="SANA Boutique Shop"
        >

            <div class="brand-name">
                SANA
            </div>

            <div class="brand-subtitle">
                SHOP
            </div>

        </div>


        <!-- SEARCH -->

        <button
            type="button"
            class="header-button"
            id="shopSearchButton"
            aria-label="Open product search"
        >
            ⌕
        </button>

    </header>



    <!-- =====================================
         SHOP PAGE
    ====================================== -->

    <main class="shop-page">


        <!-- =====================================
             SHOP INTRO
        ====================================== -->

        <section
            class="shop-intro"
            aria-labelledby="shopTitle"
        >

            <span class="shop-eyebrow">
                DISCOVER
            </span>


            <h1 id="shopTitle">
                Our Collection
            </h1>


            <p>
                Explore elegant pieces
                carefully selected for you.
            </p>

        </section>



        <!-- =====================================
             SEARCH
        ====================================== -->

        <section
            class="shop-search"
            id="shopSearch"
            aria-label="Product search"
        >

            <div class="search-box">


                <!-- SEARCH ICON -->

                <span
                    class="search-icon"
                    aria-hidden="true"
                >
                    ⌕
                </span>


                <!-- SEARCH INPUT -->

                <input
                    type="search"
                    id="productSearch"
                    name="productSearch"
                    placeholder="Search products..."
                    autocomplete="off"
                    aria-label="Search products"
                >


                <!-- CLEAR -->

                <button
                    type="button"
                    id="clearSearch"
                    class="clear-search"
                    aria-label="Clear search"
                >
                    ×
                </button>


            </div>

        </section>



        <!-- =====================================
             CATEGORIES
        ====================================== -->

        <section
            class="shop-categories"
            aria-label="Product categories"
        >

            <div
                class="category-scroll"
                id="categoryFilters"
            >


                <!-- ALL -->

                <button
                    type="button"
                    class="category-filter active"
                    data-category="all"
                    aria-pressed="true"
                >
                    All
                </button>


                <!-- UNSTITCHED -->

                <button
                    type="button"
                    class="category-filter"
                    data-category="unstitched"
                    aria-pressed="false"
                >
                    Unstitched
                </button>


                <!-- KURTIS -->

                <button
                    type="button"
                    class="category-filter"
                    data-category="kurtis"
                    aria-pressed="false"
                >
                    Kurtis
                </button>


                <!-- ABAYAS -->

                <button
                    type="button"
                    class="category-filter"
                    data-category="abayas"
                    aria-pressed="false"
                >
                    Abayas
                </button>


                <!-- SHAWLS -->

                <button
                    type="button"
                    class="category-filter"
                    data-category="shawls"
                    aria-pressed="false"
                >
                    Shawls
                </button>


                <!-- OTHER -->

                <button
                    type="button"
                    class="category-filter"
                    data-category="other"
                    aria-pressed="false"
                >
                    Other
                </button>


            </div>

        </section>



        <!-- =====================================
             RESULTS HEADER
        ====================================== -->

        <section class="results-header">


            <div>

                <span class="results-label">
                    COLLECTION
                </span>


                <h2 id="resultsTitle">
                    All Products
                </h2>

            </div>


            <!-- FILTER -->

            <button
                type="button"
                class="filter-button"
                id="filterButton"
                aria-label="Filter products"
            >
                ☷ Filter
            </button>


        </section>



        <!-- =====================================
             PRODUCTS
        ====================================== -->

        <section
            class="shop-products"
            aria-label="Products"
        >

            <div
                class="products-grid"
                id="shopProducts"
            >

                <!-- JS loads products here -->

                <div class="loading">

                    Loading collection...

                </div>

            </div>

        </section>



    </main>



    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->

    <nav
        class="bottom-navigation"
        aria-label="Main navigation"
    >


        <!-- HOME -->

        <a
            href="../index.html"
            class="nav-item"
            aria-label="Home"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⌂
            </span>

            <span>
                Home
            </span>

        </a>



        <!-- SHOP -->

        <a
            href="shop.html"
            class="nav-item active"
            aria-current="page"
            aria-label="Shop"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ♧
            </span>

            <span>
                Shop
            </span>

        </a>



        <!-- CREATE PRODUCT -->

        <a
            href="post.html"
            class="post-button"
            id="postButton"
            aria-label="Create new product"
        >
            +
        </a>



        <!-- ABOUT -->

        <a
            href="about.html"
            class="nav-item"
            aria-label="About"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ♙
            </span>

            <span>
                About
            </span>

        </a>



        <!-- CONTACT -->

        <a
            href="contact.html"
            class="nav-item"
            aria-label="Contact"
        >

            <span
                class="nav-icon"
                aria-hidden="true"
            >
                ⌕
            </span>

            <span>
                Contact
            </span>

        </a>


    </nav>


</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<!-- Global application -->

<script
    src="../js/app.js"
></script>


<!-- Navigation -->

<script
    src="../js/navigation.js"
></script>


<!-- REAL BACKEND API -->

<script
    src="../js/api.js"
></script>


<!-- Shop controller -->

<script
    src="../js/shop.js"
></script>


</body>

</html>
