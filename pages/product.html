<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0d0d0d"
    >

    <meta
        name="description"
        content="View product details from SANA Boutique."
    >

    <title>Product | SANA Boutique</title>


    <!-- =====================================
         GOOGLE FONTS
    ====================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="../css/product.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <!-- =====================================
         SANA HEADER STYLE
         No header.css needed
    ====================================== -->

    <style>

        /* =====================================
           HEADER
        ===================================== */

        .app-header {

            position: sticky;

            top: 0;

            z-index: 900;

            width: 100%;

            height: 70px;

            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            padding: 0 18px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(5, 5, 5, 0.98),
                    rgba(8, 8, 8, 0.94)
                );

            border-bottom:
                1px solid
                rgba(217, 169, 40, 0.18);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.35);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

        }


        /* =====================================
           HEADER BUTTONS
        ===================================== */

        .header-button {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.04);

            border:
                1px solid
                rgba(217, 169, 40, 0.22);

            color:
                var(--gold-light);

            font-size: 22px;

            line-height: 1;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        .header-button:active {

            transform: scale(0.90);

        }


        .header-button:hover {

            background:
                rgba(217, 169, 40, 0.10);

            box-shadow:
                0 0 18px
                rgba(217, 169, 40, 0.14);

        }


        /* =====================================
           LEFT HEADER BUTTON
        ===================================== */

        .app-header .header-button:first-child {

            justify-self: start;

        }


        /* =====================================
           RIGHT HEADER BUTTON
        ===================================== */

        .app-header .header-button:last-child {

            justify-self: end;

        }


        /* =====================================
           BRAND
        ===================================== */

        .app-header .brand {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            line-height: 1;

        }


        .app-header .brand-name {

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 27px;

            font-weight: 600;

            letter-spacing: 5px;

            color:
                var(--cream);

            text-shadow:
                0 0 15px
                rgba(255, 255, 255, 0.06);

        }


        .app-header .brand-subtitle {

            margin-top: 5px;

            font-family:
                "Inter",
                sans-serif;

            font-size: 8px;

            font-weight: 600;

            letter-spacing: 4px;

            color:
                var(--gold-light);

        }


        /* =====================================
           PRODUCT PAGE
        ===================================== */

        .product-page {

            width: 100%;

            min-height: 100vh;

        }


        /* =====================================
           MOBILE HEADER
        ===================================== */

        @media (max-width: 480px) {

            .app-header {

                height: 68px;

                padding: 0 14px;

            }


            .header-button {

                width: 40px;

                height: 40px;

                font-size: 21px;

            }


            .app-header .brand-name {

                font-size: 25px;

                letter-spacing: 4px;

            }


            .app-header .brand-subtitle {

                font-size: 7px;

                letter-spacing: 3px;

            }

        }


        /* =====================================
           LARGER SCREENS
        ===================================== */

        @media (min-width: 768px) {

            .app-header {

                max-width: 700px;

                margin: 0 auto;

            }

        }

    </style>


    <!-- =====================================
         PRODUCT IMAGE VIEWER CSS
    ====================================== -->

    <style>

        .product-main-image {

            position: relative;

            cursor: zoom-in;

            overflow: hidden;

        }


        .product-main-image img {

            display: block;

            width: 100%;

            height: auto;

            cursor: zoom-in;

            transition:
                transform 0.35s ease,
                opacity 0.25s ease;

        }


        .product-main-image:hover img {

            transform: scale(1.02);

        }


        .product-image-view-hint {

            position: absolute;

            right: 14px;

            bottom: 14px;

            z-index: 5;

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 9px 13px;

            border-radius: 999px;

            background:
                rgba(0, 0, 0, 0.68);

            color: #ffffff;

            font-family: Inter, sans-serif;

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 0.08em;

            pointer-events: none;

            backdrop-filter: blur(8px);

        }


        /* =====================================
           FULLSCREEN VIEWER
        ===================================== */

        .product-image-viewer {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.94);

            backdrop-filter: blur(12px);

            opacity: 0;

            transition:
                opacity 0.25s ease;

        }


        .product-image-viewer.active {

            display: flex;

            opacity: 1;

        }


        .product-image-viewer img {

            display: block;

            max-width: 96vw;

            max-height: 88vh;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 4px;

            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, 0.55);

            animation:
                productImageZoom 0.25s ease;

        }


        @keyframes productImageZoom {

            from {

                transform: scale(0.94);

                opacity: 0;

            }

            to {

                transform: scale(1);

                opacity: 1;

            }

        }


        /* =====================================
           CLOSE BUTTON
        ===================================== */

        .product-viewer-close {

            position: fixed;

            top: 18px;

            right: 18px;

            z-index: 100000;

            width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 50%;

            background:
                rgba(20,20,20,0.8);

            color: #ffffff;

            font-size: 28px;

            line-height: 1;

            cursor: pointer;

        }


        .product-viewer-close:active {

            transform: scale(0.94);

        }


        .product-viewer-loading {

            position: absolute;

            color: #ffffff;

            font-family: Inter, sans-serif;

            font-size: 13px;

            letter-spacing: 0.08em;

        }


        body.product-viewer-open {

            overflow: hidden;

        }


        /* =====================================
           MOBILE IMAGE VIEWER
        ===================================== */

        @media (max-width: 600px) {

            .product-image-viewer {

                padding: 10px;

            }


            .product-image-viewer img {

                max-width: 100vw;

                max-height: 82vh;

                border-radius: 0;

            }


            .product-viewer-close {

                top: 12px;

                right: 12px;

            }

        }

    </style>

</head>


<body>

<div id="app">


    <!-- =====================================
         HEADER
    ===================================== -->

    <header class="app-header">


        <!-- BACK -->

        <button
            type="button"
            class="header-button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-name">
                SANA
            </div>

            <div class="brand-subtitle">
                PRODUCT
            </div>

        </div>


        <!-- FAVORITE -->

        <button
            type="button"
            class="header-button"
            id="productFavorite"
            aria-label="Favorite product"
        >
            ♡
        </button>

    </header>



    <!-- =====================================
         PRODUCT CONTENT
    ====================================== -->

    <main class="product-page">

        <div
            id="productDetails"
            class="product-details"
        >

            <div class="loading">

                Loading product...

            </div>

        </div>

    </main>



    <!-- =====================================
         FULLSCREEN IMAGE VIEWER
    ====================================== -->

    <div
        id="productImageViewer"
        class="product-image-viewer"
        role="dialog"
        aria-modal="true"
        aria-label="Product image viewer"
    >

        <button
            type="button"
            id="productViewerClose"
            class="product-viewer-close"
            aria-label="Close image"
        >
            ×
        </button>


        <div
            class="product-viewer-loading"
            id="productViewerLoading"
        >
            Loading image...
        </div>


        <img
            id="productViewerImage"
            src=""
            alt="Product image"
        >

    </div>



    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->

    <nav class="bottom-navigation">


        <a
            href="../index.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </a>


        <a
            href="shop.html"
            class="nav-item active"
        >

            <span class="nav-icon">
                ♧
            </span>

            <span>
                Shop
            </span>

        </a>


        <a
            href="post.html"
            class="post-button"
            id="postButton"
            aria-label="Create product"
        >
            +
        </a>


        <a
            href="about.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ♙
            </span>

            <span>
                About
            </span>

        </a>


        <a
            href="contact.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ⌕
            </span>

            <span>
                Contact
            </span>

        </a>

    </nav>


</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="../js/app.js"></script>

<script src="../js/navigation.js"></script>

<script src="../js/api.js"></script>

<script src="../js/product.js"></script>



<!-- =====================================
     PRODUCT IMAGE VIEWER
====================================== -->

<script>

"use strict";


document.addEventListener(
    "DOMContentLoaded",
    setupProductImageViewer
);


function setupProductImageViewer() {

    const viewer =
        document.getElementById(
            "productImageViewer"
        );

    const viewerImage =
        document.getElementById(
            "productViewerImage"
        );

    const closeButton =
        document.getElementById(
            "productViewerClose"
        );

    const loading =
        document.getElementById(
            "productViewerLoading"
        );


    if (
        !viewer ||
        !viewerImage ||
        !closeButton
    ) {

        return;

    }


    /*
     * Product image is generated
     * dynamically by product.js.
     */

    const observer =
        new MutationObserver(() => {

            const productImage =
                document.querySelector(
                    ".product-main-image img"
                );


            if (!productImage) {

                return;

            }


            if (
                productImage.dataset.viewerReady ===
                "true"
            ) {

                return;

            }


            productImage.dataset.viewerReady =
                "true";


            productImage.style.cursor =
                "zoom-in";


            productImage.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();

                    openProductImage(
                        productImage.src,
                        productImage.alt
                    );

                }
            );


            const imageContainer =
                productImage.closest(
                    ".product-main-image"
                );


            if (
                imageContainer &&
                !imageContainer.querySelector(
                    ".product-image-view-hint"
                )
            ) {

                const hint =
                    document.createElement(
                        "div"
                    );

                hint.className =
                    "product-image-view-hint";

                hint.innerHTML =
                    "⌕ TAP TO VIEW";

                imageContainer.appendChild(
                    hint
                );

            }

        });


    const productDetails =
        document.getElementById(
            "productDetails"
        );


    if (productDetails) {

        observer.observe(
            productDetails,
            {
                childList: true,
                subtree: true
            }
        );

    }


    /* =====================================
       OPEN VIEWER
    ===================================== */

    function openProductImage(
        src,
        alt
    ) {

        if (!src) return;


        viewerImage.src = "";

        viewerImage.alt =
            alt || "Product image";


        if (loading) {

            loading.style.display =
                "block";

            loading.textContent =
                "Loading image...";

        }


        viewer.classList.add(
            "active"
        );


        document.body.classList.add(
            "product-viewer-open"
        );


        requestAnimationFrame(() => {

            viewerImage.src = src;

        });


        viewerImage.onload = () => {

            if (loading) {

                loading.style.display =
                    "none";

            }

        };


        viewerImage.onerror = () => {

            if (loading) {

                loading.textContent =
                    "Unable to load image";

            }

        };

    }


    /* =====================================
       CLOSE VIEWER
    ===================================== */

    function closeViewer() {

        viewer.classList.remove(
            "active"
        );

        document.body.classList.remove(
            "product-viewer-open"
        );


        setTimeout(() => {

            viewerImage.src = "";

        }, 250);

    }


    closeButton.addEventListener(
        "click",
        closeViewer
    );


    viewer.addEventListener(
        "click",
        event => {

            if (
                event.target === viewer
            ) {

                closeViewer();

            }

        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                viewer.classList.contains(
                    "active"
                )
            ) {

                closeViewer();

            }

        }
    );

}

</script>


</body>

</html>
