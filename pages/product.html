<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | SANA Boutique</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/base.css"
    >

    <link
        rel="stylesheet"
        href="../css/navigation.css"
    >

    <link
        rel="stylesheet"
        href="../css/product.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>

<div id="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="app-header">

        <button
            class="header-button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <div class="brand">

            <div class="brand-name">
                SANA
            </div>

            <div class="brand-subtitle">
                PRODUCT
            </div>

        </div>


        <button
            class="header-button"
            id="productFavorite"
            aria-label="Favorite"
        >
            ♡
        </button>

    </header>



    <!-- =====================================
         PRODUCT DETAILS
    ====================================== -->

    <main class="product-page">

        <div
            id="productDetails"
            class="product-details"
        >

            <div class="loading">
                Loading product...
            </div>

        </div>

    </main>



    <!-- =====================================
         BOTTOM NAVIGATION
    ====================================== -->

    <nav class="bottom-navigation">


        <a
            href="../index.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span>
                Home
            </span>

        </a>



        <a
            href="shop.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ♧
            </span>

            <span>
                Shop
            </span>

        </a>



        <!-- CENTER POST BUTTON -->

        <a
            href="post.html"
            class="post-button"
            id="postButton"
            aria-label="Create product"
        >
            +
        </a>



        <a
            href="about.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ♙
            </span>

            <span>
                About
            </span>

        </a>



        <a
            href="contact.html"
            class="nav-item"
        >

            <span class="nav-icon">
                ⌕
            </span>

            <span>
                Contact
            </span>

        </a>


    </nav>


</div>



<!-- =====================================
     JAVASCRIPT
====================================== -->

<script src="../js/app.js"></script>

<script src="../js/navigation.js"></script>

<!-- REAL BACKEND API -->

<script src="../js/api.js"></script>

<!-- PRODUCT CONTROLLER -->

<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/product.js"></script>


</body>

</html>
